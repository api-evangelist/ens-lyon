    summary: >-
      ENS de Lyon has no dedicated, branded developer portal of its own. Its real,
      verifiable machine-readable footprint is its open-access institutional
      repository HAL-ENS-LYON, which rides on the national HAL platform's
      well-documented APIs (OAI-PMH, Search, Reference, SWORD) hosted at
      api.archives-ouvertes.fr. I verified the ens-lyon-scoped OAI-PMH Identify and
      Search endpoints resolve live (HTTP 200), the HAL API docs hub resolves, and
      the repository, official website, GitHub org, and LinkedIn school page all
      exist. The official GitHub org (github.com/ens-lyon) loads but publishes zero
      public repositories. No course/catalog/SIS, library Alma/Primo, or branded
      institutional API was found publicly documented; none were fabricated.
