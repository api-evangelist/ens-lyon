x-coverage:
  state: gated
  reason: no_public_api
  detail: >-
    ENS de Lyon publishes no institution-operated public API and no developer portal. A DNS
    sweep of the obvious candidates under ens-lyon.fr (api, apis, data, opendata, developer,
    courses, cours, sis, webservices, graphql, hpc, mesocentre, moodle, bibliotheque,
    catalogue) resolved only ldap, intranet, cas and idp — three of which are internal or
    authentication-only. www.ens-lyon.fr returns 404 for llms.txt, sitemap.xml,
    .well-known/security.txt and .well-known/openid-configuration, and serves a 77KB soft-404
    body, so status codes were read rather than page presence. Everything reachable WAS read:
    the Shibboleth IdP metadata (application/xml, 12,129 bytes), the RENATER Fédération
    Éducation-Recherche MDQ entity for that entityID in both the fer and edugain namespaces,
    the RENATER IdP aggregate (344 entities, ENS de Lyon present), the Entra ID OIDC discovery
    document and its SAML federation metadata, the CAS 3.0 serviceValidate response, the HAL
    OAI-PMH Identify response for the ens-lyon set, the HAL Solr search endpoint scoped to the
    ens-lyon collection (106,836 records), and the ROR and Crossref Funder Registry records.
    Two surfaces are live but not machine-callable: the HAL institutional portal
    ens-lyon.hal.science and books.openedition.org both return a 200 carrying an Anubis
    bot-mitigation challenge rather than content. The github.com/ENS-Lyon organisation that
    the June 2026 profile pointed at has zero public repositories, no name, no URL and no
    verified domain, so it cannot be attributed to the institution and the pointer has been
    removed. No public AI policy or AI-tooling statement was found on the French or English
    surface. The profile is thin because the institution is thin, not because we could not read it.
