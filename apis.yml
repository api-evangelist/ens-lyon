aid: ens-lyon
name: École Normale Supérieure de Lyon
x-type: university
x-category: Public Research University
description: >-
  École Normale Supérieure de Lyon (ENS de Lyon) is a French public grande école and
  research university, one of the four Écoles normales supérieures, ranked #187 in the
  QS World University Rankings 2025. It operates no public developer portal, publishes
  no OpenAPI, issues no API keys and runs no documented open-API programme — api.ens-lyon.fr,
  data.ens-lyon.fr and developer.ens-lyon.fr do not resolve — and this profile says so
  rather than padding the gap. What ENS de Lyon does operate, and what is recorded here,
  is standards-based identity and scholarly infrastructure. It self-hosts a Shibboleth
  Identity Provider on its own domain (idp.ens-lyon.fr, scope ens-lyon.fr, on the school's
  own 140.77.0.0/16 allocation), registered by RENATER in the Fédération Éducation-Recherche,
  carrying the REFEDS Research & Scholarship entity category and exported to eduGAIN; it
  runs an Apereo CAS single sign-on service at cas.ens-lyon.fr that answers the CAS 3.0
  protocol; and it holds a Microsoft Entra ID tenant with live OIDC discovery. Its research
  output is machine-readable only as the ens-lyon collection on HAL, the national open
  archive operated by CCSD/CNRS — 106,836 records, harvestable over OAI-PMH and Solr search
  at api.archives-ouvertes.fr. That data is ENS de Lyon's; the platform, the contract and the
  admin contact (contact@archives-ouvertes.fr) are HAL's, so those surfaces are recorded as
  tenancies and HAL's generic reference and SWORD APIs are deliberately not claimed here.
  The school is registered in ROR and in the Crossref Funder Registry; it holds no DataCite
  membership and no Crossref depositor membership of its own.
