apis:
  - aid: ens-lyon:shibboleth-idp
    name: ENS de Lyon Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: institution
    description: >-
      ENS de Lyon self-hosts its Shibboleth Identity Provider on its own registrable domain.
      The entityID is https://idp.ens-lyon.fr/idp/shibboleth, the asserted scope is
      ens-lyon.fr, the technical contact is admin-system@ens-lyon.fr and the host resolves
      through lxc-idp.ens-lyon.fr to 140.77.167.96, inside the school's own allocation. The
      metadata document is served unauthenticated as application/xml and supports Shibboleth
      1.0, SAML 1.1 and SAML 2.0 (HTTP-POST and HTTP-Redirect SSO bindings). This is the
      strongest institution-operated machine-readable surface in this repository. Note that
      the self-served copy is the Shibboleth stock template — the authoritative, signed
      metadata is the RENATER federation copy recorded separately below.
    humanURL: https://services.renater.fr/federation/
    baseURL: https://idp.ens-lyon.fr/idp/shibboleth
    tags: [ Identity, SAML, Shibboleth, Single Sign-On, Federation ]
