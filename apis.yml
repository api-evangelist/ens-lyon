  - aid: ens-lyon:renater-fer-entity
    name: RENATER Fédération Éducation-Recherche entity (ENS de Lyon IdP)
    x-operator: federation
    description: >-
      ENS de Lyon's Identity Provider as registered by RENATER, France's national research and
      education network, in the Fédération Éducation-Recherche and exported to eduGAIN. The
      per-entity MDQ endpoint returns the signed EntityDescriptor (registrationAuthority
      https://federation.renater.fr/, OrganizationName "Ecole Normale Supérieure de Lyon",
      mdui:DisplayName "ENS de Lyon" in fr and en, REFEDS Research & Scholarship entity
      category). The MDQ service requires an Accept header of application/samlmetadata+xml.
      The federation is shared by definition; the IdP behind this entry is ENS de Lyon's own.
    humanURL: https://services.renater.fr/federation/
